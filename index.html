<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GYRO CLASH ONLINE</title>
<link rel="stylesheet" href="style.css?v=0.14.19-202610171026">
</head>
<body>
<canvas id="stage"></canvas>
<div id="vignette"></div>
<div id="realm"></div>
<div id="flash"></div>
<div id="labels"></div>

<div id="hud" class="hidden">
  <div class="top-bar">
    <div class="fcol" id="fl"></div>
    <div class="clock"><div id="round">ROUND 1</div><div id="time">75</div></div>
    <div class="fcol" id="fr"></div>
  </div>
  <div class="bottom">
    <div id="skillbar"></div>
    <div class="hint"><b>クリック</b> 移動　<b>Q W E R</b> スキル（照準が出るものは長押し → 離して発動）　<b>F</b> フラッシュ（1ラウンドに1回）　<b>右クリック</b> 照準キャンセル</div>
  </div>
</div>

<div id="practice" class="hidden"></div>

<div id="announce"></div>
<div id="cutin"></div>

<div id="toast"></div>
<div id="version"></div>

<div id="sys">
  <span id="netstat" class="hidden"></span>
  <button id="btn-mute">♪ ON</button>
  <button id="btn-pause">Ⅱ</button>
</div>

<div id="title" class="screen">
  <div class="logo">
    <div class="logo-sub">ONLINE SPIN BATTLE</div>
    <h1>GYRO<span>CLASH</span></h1>
    <div class="logo-ja">ジャイロクラッシュ</div>
  </div>
  <button id="btn-host" class="primary start">START</button>
</div>

<div id="lobby" class="screen hidden">
  <div class="panel room">
    <div class="room-head">
      <h2><i>ROOM</i> ルーム</h2>
      <div id="lb-status" class="lb-status"></div>
      <div id="lb-invite" class="ghost">
        <label for="lb-url">招待URL</label>
        <input id="lb-url" readonly><button id="lb-copy">コピー</button>
      </div>
    </div>
    <div class="room-body">
      <div id="lb-cards" class="room-cards"></div>
      <div class="room-side">
        <div class="room-stage">
          <h3>STAGE</h3>
          <div class="stage-view">
            <button id="st-prev" aria-label="前のステージ">◀</button>
            <div id="st-pic"></div>
            <button id="st-next" aria-label="次のステージ">▶</button>
          </div>
          <b id="st-name"></b>
          <span id="st-ja"></span>
          <h3 class="sub">SIZE</h3>
          <div id="lb-size"></div>
        </div>
        <div class="room-rules">
          <h3>RULE</h3>
          <div id="lb-rules"></div>
        </div>
        <div class="room-go">
          <button id="lb-ready" class="room-btn cyan">準備完了</button>
          <button id="lb-start" class="room-btn gold">ゲーム開始</button>
          <button id="lb-leave" class="room-btn dark">退出する</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="picker" class="screen overlay hidden">
  <div class="panel picker">
    <h2><i>BLADE</i> ブレードを選ぶ<span id="lb-editing"></span></h2>
    <div class="picker-body">
      <div id="blades"></div>
      <div class="picker-detail">
        <h3 id="how-name"></h3>
        <div id="sheet"></div>
        <div id="how"></div>
      </div>
    </div>
    <div class="res-btns"><button id="pk-ok" class="primary">決定</button></div>
  </div>
</div>

<div id="result" class="screen hidden">
  <div class="res">
    <div id="res-title">VICTORY</div>
    <div id="res-sub"></div>
    <div id="res-score"></div>
    <div id="res-finish"></div>
    <table id="res-stats"></table>
    <div class="res-btns">
      <button id="btn-again" class="primary">もう一度</button>
      <button id="btn-lobby" class="hidden">ロビーに戻る</button>
      <button id="btn-back">ルームに戻る</button>
    </div>
  </div>
</div>

<div id="pause" class="screen hidden">
  <div class="res small">
    <div class="pause-title" id="pause-title">PAUSE</div>
    <p id="pause-note"></p>
    <div class="res-btns">
      <button id="btn-resume" class="primary">つづける</button>
      <button id="btn-quit">タイトルへ</button>
    </div>
  </div>
</div>

<script src="game.js?v=0.14.19-202610171026"></script>
</body>
</html>
